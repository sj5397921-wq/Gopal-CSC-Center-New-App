name: Gopal CSC Center - Fresh Android App

on:
  push:
    branches:
      - fresh-start-login
    paths:
      - 'fresh-app/**'
      - '.github/workflows/fresh-app-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: fresh-app
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gopal-CSC-Center-Fresh-APK
          path: fresh-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
